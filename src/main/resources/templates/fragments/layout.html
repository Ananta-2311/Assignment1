<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle}">Consultant Management System</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<style>
		body {
			background-color: #f5f7fa;
			min-height: 100vh;
		}
		.app-navbar {
			background-color: #1f2a37;
		}
		.app-navbar .navbar-brand,
		.app-navbar .nav-link {
			color: #f3f4f6;
		}
		.app-navbar .nav-link:hover,
		.app-navbar .nav-link:focus {
			color: #ffffff;
		}
		.app-navbar .nav-link.active {
			color: #ffffff;
			font-weight: 600;
		}
		.page-shell {
			padding-top: 2rem;
			padding-bottom: 3rem;
		}
		.stat-panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 0.5rem;
			padding: 1.5rem;
		}
		.content-panel {
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 0.5rem;
			padding: 1.5rem;
		}
	</style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar">
	<div class="container">
		<a class="navbar-brand fw-semibold" th:href="@{/dashboard}">Consultant Management System</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
			aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="mainNavbar">
			<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
				<li class="nav-item">
					<a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/consultants}">Consultants</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/consultants/add}">Add Consultant</a>
				</li>
			</ul>
		</div>
	</div>
</nav>

<div th:fragment="scripts">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
</div>
</body>
</html>
