<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle} + ' | Consultant Management System')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container page-shell">
	<div class="mb-4">
		<h1 class="h2 mb-1" th:text="${pageTitle}">Consultant Form</h1>
		<p class="text-secondary mb-0">Enter consultant details and save the record.</p>
	</div>

	<div class="content-panel col-lg-8 px-0">
		<form th:action="@{${formAction}}" th:object="${consultant}" method="post" class="p-4">
			<div class="mb-3">
				<label for="name" class="form-label">Name</label>
				<input id="name" type="text" class="form-control"
					th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div>

			<div class="mb-3">
				<label for="email" class="form-label">Email</label>
				<input id="email" type="email" class="form-control"
					th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
			</div>

			<div class="mb-3">
				<label for="phone" class="form-label">Phone</label>
				<input id="phone" type="text" class="form-control"
					th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
			</div>

			<div class="mb-3">
				<label for="technology" class="form-label">Technology</label>
				<input id="technology" type="text" class="form-control"
					th:field="*{technology}" th:classappend="${#fields.hasErrors('technology')} ? ' is-invalid'">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('technology')}" th:errors="*{technology}"></div>
			</div>

			<div class="mb-4">
				<label for="experience" class="form-label">Experience (years)</label>
				<input id="experience" type="number" min="0" class="form-control"
					th:field="*{experience}" th:classappend="${#fields.hasErrors('experience')} ? ' is-invalid'">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}"></div>
			</div>

			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary" th:text="${pageTitle}">Save</button>
				<a class="btn btn-outline-secondary" th:href="@{/consultants}">Cancel</a>
			</div>
		</form>
	</div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
